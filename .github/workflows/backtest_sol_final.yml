name: Run Final SOL Backtest

on:
  workflow_dispatch:

# ✅ THIS FORCES GITHUB TO CANCEL THE STUCK RUN
concurrency:
  group: sol-backtest-queue
  cancel-in-progress: true

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy ccxt

      - name: Run Backtest
        run: python backtest_sol_final.py
