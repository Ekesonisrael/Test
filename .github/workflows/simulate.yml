name: simulate-profit

on:
  workflow_dispatch: # This lets you click a button to run it manually
  push:
    paths:
      - 'simulate.py' # Runs automatically if you change the simulation code

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Historical Simulation
        run: |
          python simulate.py
